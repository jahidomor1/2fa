name: Build Web App to APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Bubblewrap & Build APK
      run: |
        npm install -g @bubblewrap/cli
        mkdir android-build
        cd android-build
        npx @bubblewrap/cli init --manifest=../manifest.json || true
        
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: web-app-apk
        path: ./**/*.apk
        
