name: Build Web App Artifacts

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Upload Web Files
      uses: actions/upload-artifact@v4
      with:
        name: my-web-app
        path: .
        
